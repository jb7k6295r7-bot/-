name: 每日台股資料

on:
  schedule:
    # UTC 09:30 = 台北 17:30，週一至週五。
    # 台股 13:30 收盤，證交所的三大法人（T86）約 16:00 前後才齊，所以排 17:30。
    - cron: "30 9 * * 1-5"
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一次

permissions:
  contents: write           # 要把抓到的檔案 commit 回 repo

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓資料
        run: python fetch.py

      - name: Commit 回 repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest
          if git diff --staged --quiet; then
            echo "沒有變動，不 commit"
          else
            git commit -m "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北"
            git push
          fi
